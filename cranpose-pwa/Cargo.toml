[package]
name = "cranpose-pwa"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Progressive Web App support for Cranpose: device detection, installability, install prompt and service worker"
publish = false

[lib]
path = "src/lib.rs"

[features]
default = ["widget"]
# Composables that render the install banner / status, built on cranpose-ui.
widget = ["dep:cranpose-ui", "dep:cranpose-core", "dep:cranpose-animation", "dep:cranpose-liquid"]
# Web platform code is gated by target_arch = "wasm32" below; on other targets
# it compiles to typed no-ops so the crate lives in a cross-platform workspace.

[dependencies]
# Always available (pure logic, works on native too).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "Document", "Event", "EventTarget", "Element",
    "HtmlElement", "HtmlCanvasElement", "MediaQueryList", "ServiceWorker",
    "ServiceWorkerContainer", "ServiceWorkerRegistration", "Location", "Url",
    "UrlSearchParams", "History",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranpose-ui = { version = "0.24.0", optional = true }
cranpose-core = { version = "0.24.0", optional = true }
cranpose-animation = { version = "0.24.0", optional = true }
cranpose-liquid = { version = "0.24.0", optional = true }

[dev-dependencies]
