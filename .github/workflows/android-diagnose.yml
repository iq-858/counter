name: Diagnose Android launch (logcat)

# Boots the signed APK on a GitHub-hosted Android emulator, launches the
# activity and captures logcat. The reason the app exits shows up as
# AndroidRuntime / FATAL / cranpose lines. KVM must be enabled for the
# emulator to boot on Linux — see ReactiveCircus/android-emulator-runner README.
on:
  workflow_dispatch:
    inputs:
      apk_artifact_run:
        description: 'Run id that produced counter-signed-apk (e.g. 45046825409)'
        type: string
        default: '45046825409'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the signed APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_RUN: ${{ inputs.apk_artifact_run }}
        run: |
          gh run download "$APK_RUN" -R iq-858/counter -p counter-signed-apk -D apk
          APK=$(find apk -name '*.apk' | head -n 1)
          echo "APK=$APK"
          echo "APK_PATH=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_ENV"

      - name: Boot emulator, install APK, capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: counter_diag
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "=== EMULATOR READY ==="
            adb shell getprop ro.build.version.release
            echo "=== INSTALL APK ==="
            adb install -r "$APK_PATH"
            echo "=== CLEAR LOGCAT ==="
            adb logcat -c
            echo "=== LAUNCH ACTIVITY ==="
            adb shell monkey -p com.example.counter -c android.intent.category.LAUNCHER 1 || true
            echo "=== WAIT 15s ==="
            sleep 15
            echo "=== DUMP LOGCAT ==="
            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/logcat.txt" || true
            cat "$GITHUB_WORKSPACE/logcat.txt"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logcat
          path: logcat.txt
          if-no-files-found: warn
