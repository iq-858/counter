name: Video Engine — Cross-Platform Verification

# Tests the cranpose-video engine on every supported target.
# cargo check / test on native runners + cargo check cross-targets for mobile.
# This is compile + unit verification, NOT real-device playback (documented).
on:
  workflow_dispatch:
  push:
    paths:
      - 'cranpose-video/**'
      - '.github/workflows/video-engine-matrix.yml'

permissions:
  contents: read

jobs:
  # ---------- Native: full tests ----------
  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check (all features)
        run: cargo check --manifest-path cranpose-video/Cargo.toml --all-features
      - name: Unit + integration tests
        run: cargo test --manifest-path cranpose-video/Cargo.toml --features player,native-audio

  native-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check (all features)
        run: cargo check --manifest-path cranpose-video/Cargo.toml --all-features
      - name: Tests (serial to avoid CI timing jitter)
        run: cargo test --manifest-path cranpose-video/Cargo.toml --features player,native-audio -- --test-threads=1

  native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GStreamer dev
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav \
            libasound2-dev
      - name: Check (gstreamer)
        run: cargo check --manifest-path cranpose-video/Cargo.toml --features player,native-audio,linux-gstreamer
      - name: Tests (serial to avoid CI timing jitter)
        run: cargo test --manifest-path cranpose-video/Cargo.toml --features player,native-audio -- --test-threads=1

  # ---------- Cross compile: iOS (macOS runner has xcrun) ----------
  cross-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Check iOS target
        run: cargo check --manifest-path cranpose-video/Cargo.toml --target aarch64-apple-ios --no-default-features --features widget

  # ---------- Cross compile: Android (Ubuntu with NDK clang) ----------
  cross-android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Check Android target ${{ matrix.target }}
        run: |
          case "${{ matrix.target }}" in
            aarch64-linux-android) CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang ;;
            armv7-linux-androideabi) CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang ;;
          esac
          export CC
          cargo check --manifest-path cranpose-video/Cargo.toml --target ${{ matrix.target }} --no-default-features --features widget

  # ---------- Cross compile: wasm ----------
  cross-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Check wasm target
        run: cargo check --manifest-path cranpose-video/Cargo.toml --target wasm32-unknown-unknown --no-default-features --features widget

  # ---------- WebAssembly build via wasm-pack ----------
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build WASM probe (engine detection path)
        run: wasm-pack build cranpose-pwa/examples/probe --target web --out-dir /tmp/web-probe
