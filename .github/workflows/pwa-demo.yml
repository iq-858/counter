name: Deploy PWA demo

# Publishes cranpose-pwa/demo to GitHub Pages at:
# https://iq-858.github.io/counter/pwa/
# A public URL you can open on an iPhone to test installability + detection.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cranpose-pwa/demo
      - id: deployment
        uses: actions/deploy-pages@v4
